[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agatha-client"
version = "0.5.1"
description = "Cliente da Agatha: conversa por voz com o servidor (microfone e alto-falante)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "sounddevice==0.5.6",
    "websockets==17.2",
]

[project.optional-dependencies]
# Para --wav (enviar um arquivo em vez do microfone)
wav = ["soundfile==0.14.0"]
# Barge-in (ADR-014/016): detector da wake word "Agatha" (openWakeWord, ONNX)
barge-in = ["openwakeword==0.6.0", "onnxruntime==1.31.0"]
# Segundo plano no Windows (ADR-021): ícone na bandeja
tray = ["pystray==0.19.5", "Pillow==11.3.0"]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["agatha_client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
